<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PAOOU FASHION{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

   <!-- ENCABEZADO -->
<header class="hero">
    <div class="container text-center">

        <h1>PAOOU FASHION</h1>

        <p>
            Elegancia que inspira, estilo que enamora.
        </p>

    </div>
</header>


    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- LOGO -->
            <a class="navbar-brand"
               href="{{ url_for('inicio') }}">

                <img src="{{ url_for('static', filename='img/logo.jpeg') }}"
                     width="45"
                     class="me-2 rounded"
                     alt="Logo de PAOOU FASHION">

                PAOOU FASHION

            </a>


            <!-- BOTÓN PARA CELULAR -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu"
                    aria-controls="menu"
                    aria-expanded="false"
                    aria-label="Mostrar menú">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- OPCIONES DEL MENÚ -->
            <div class="collapse navbar-collapse"
                 id="menu">

                <ul class="navbar-nav ms-auto">


                    <!-- INICIO -->
                    <li class="nav-item">

                        <a class="nav-link"
                           href="{{ url_for('inicio') }}">

                            Inicio

                        </a>

                    </li>


                    <!-- PRODUCTOS -->
                    <li class="nav-item">
    <a class="nav-link" href="{{ url_for('productos') }}">
                            Productos
                       </a>
                    </li>

                    <!-- CLIENTES -->
                    <li class="nav-item">

                        <a class="nav-link"
                           href="{{ url_for('clientes') }}">

                            Clientes

                        </a>

                    </li>
<!-- PROVEEDORES -->
<li class="nav-item">

    <a class="nav-link"
       href="{{ url_for('proveedores') }}">

        Proveedores

    </a>

</li>
<!-- FACTURACIÓN -->
<li class="nav-item">

    <a class="nav-link"
       href="{{ url_for('facturacion') }}">

        Facturación

    </a>

</li>
         </ul>

        </div>

        </div>

    </nav>


    <!-- CONTENIDO DE CADA PÁGINA -->
    <main>

        {% block content %}

        {% endblock %}

    </main>


<!-- Pie de página: sección común para todo el sitio web -->
<footer class="text-center p-4">

    <p>2026 PAOOU FASHION</p>

    <p>Desarrollado por ACOSTA GARCIA MARIA PAOLA</p>

    <p>Asignatura: Desarrollo de Aplicaciones Web</p>

</footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
