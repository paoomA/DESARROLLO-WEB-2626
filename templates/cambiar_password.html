{% extends "base.html" %}

{% block title %}
Cambiar contraseña - PAOOU FASHION
{% endblock %}

{% block content %}

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2 class="text-center fw-bold mb-2">
                        Cambiar contraseña
                    </h2>

                    <p class="text-center text-secondary mb-4">
                        Actualiza la contraseña de tu cuenta.
                    </p>


                    {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                    {% endif %}


                    <form method="POST">

                        <!-- CONTRASEÑA ACTUAL -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Contraseña actual
                            </label>

                            <input
                                type="password"
                                name="password_actual"
                                class="form-control"
                                placeholder="Ingresa tu contraseña actual"
                                required
                            >

                        </div>


                        <!-- NUEVA CONTRASEÑA -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Nueva contraseña
                            </label>

                            <input
                                type="password"
                                name="password_nueva"
                                class="form-control"
                                placeholder="Mínimo 6 caracteres"
                                minlength="6"
                                required
                            >

                        </div>


                        <!-- REPETIR -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Repetir nueva contraseña
                            </label>

                            <input
                                type="password"
                                name="repetir_password"
                                class="form-control"
                                placeholder="Repite la nueva contraseña"
                                minlength="6"
                                required
                            >

                        </div>


                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn"
                                style="
                                    background-color: #e889ad;
                                    color: white;
                                    border: none;
                                "
                            >
                                Cambiar contraseña
                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-3">

                        <a
                            href="{{ url_for('perfil') }}"
                            class="text-decoration-none"
                        >
                            ← Volver a mi perfil
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
